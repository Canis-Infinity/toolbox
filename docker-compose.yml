services:
  toolbox:
    image: node:24-alpine
    container_name: iistw-toolbox
    working_dir: /app
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
      PORT: 6011
      NEXT_PUBLIC_SITE_URL: https://toolbox.iistw.com
    volumes:
      - ./:/app
      - toolbox_node_modules:/app/node_modules
      - toolbox_next:/app/.next
    ports:
      - "6011:6011"
    command: sh -c "if [ -f package-lock.json ]; then npm ci --include=dev; else npm install --include=dev; fi && npm run build && npm prune --omit=dev && npm start"
    restart: unless-stopped

volumes:
  toolbox_node_modules:
  toolbox_next:
